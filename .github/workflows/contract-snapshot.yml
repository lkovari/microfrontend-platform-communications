name: contract-snapshot

on:
  push:
    paths:
      - "mfe-platform-communication/src/schemas/**"
      - "mfe-platform-communication/scripts/export-schemas.mts"
      - "mfe-platform-communication/contracts-snapshot/**"
      - ".github/workflows/contract-snapshot.yml"
  pull_request:
    paths:
      - "mfe-platform-communication/src/schemas/**"
      - "mfe-platform-communication/scripts/export-schemas.mts"
      - "mfe-platform-communication/contracts-snapshot/**"
      - ".github/workflows/contract-snapshot.yml"

jobs:
  contract-snapshot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mfe-platform-communication
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: mfe-platform-communication/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm export:schemas
      - name: Verify contract snapshot is committed
        run: git diff --exit-code contracts-snapshot/
